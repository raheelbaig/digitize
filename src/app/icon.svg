<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 115 115" role="img" aria-label="Digitize Are Us">
  <!--
    The Digitize Are Us mark. Geometry and the seven CMY region colours match
    src/components/brand/BrandMark.tsx exactly (r = 30, centres 51.45/30 and
    30|72.9/70.1), shifted to sit optically centred on a square canvas.
    A favicon has to be a standalone file, so the shape is repeated here rather
    than imported.
  -->
  <defs>
    <clipPath id="y"><circle cx="51.45" cy="32.9" r="30"/></clipPath>
    <clipPath id="m"><circle cx="30" cy="70.1" r="30"/></clipPath>
  </defs>

  <!-- base primaries -->
  <circle cx="51.45" cy="32.9" r="30" fill="#f7e70a"/>
  <circle cx="30" cy="70.1" r="30" fill="#e5057f"/>
  <circle cx="72.9" cy="70.1" r="30" fill="#109bdb"/>

  <!-- pairwise overlaps -->
  <g clip-path="url(#y)">
    <circle cx="30" cy="70.1" r="30" fill="#da0507"/>
    <circle cx="72.9" cy="70.1" r="30" fill="#1a8d02"/>
  </g>
  <g clip-path="url(#m)">
    <circle cx="72.9" cy="70.1" r="30" fill="#190569"/>
  </g>

  <!-- all three -->
  <g clip-path="url(#y)">
    <g clip-path="url(#m)">
      <circle cx="72.9" cy="70.1" r="30" fill="#180205"/>
    </g>
  </g>
</svg>
